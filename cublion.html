<style>
        body {
            background-color: #011230;
            overflow-x: hidden;
        }
        
        /* Floating Logo Animation */
        .float-animation {
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Content Entrance Transitions */
        .entrance-fade {
            opacity: 0;
            transform: translateY(20px);
            animation: entrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes entrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Background Particle System Base */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Pulsing Glow Backgrounds */
        .glow-pulse-orange {
            animation: glow-orange 12s ease-in-out infinite alternate;
        }
        .glow-pulse-blue {
            animation: glow-blue 15s ease-in-out infinite alternate;
        }

        @keyframes glow-orange {
            from { opacity: 0.02; transform: scale(1); }
            to { opacity: 0.08; transform: scale(1.1); }
        }
        @keyframes glow-blue {
            from { opacity: 0.02; transform: scale(1.1); }
            to { opacity: 0.06; transform: scale(1); }
        }

        /* Button Premium Hover */
        .btn-premium-hover {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-premium-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(253, 139, 0, 0.5), 0 0 15px rgba(253, 139, 0, 0.2);
        }

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            .float-animation, 
            .entrance-fade, 
            .glow-pulse-orange, 
            .glow-pulse-blue,
            .btn-premium-hover {
                animation: none !important;
                transition: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
            #particle-canvas {
                display: none;
            }
        }

        .abstract-line {
            background: linear-gradient(90deg, transparent, rgba(253, 139, 0, 0.1), transparent);
            height: 1px;
            width: 100%;
            position: absolute;
        }

<!-- Interactive & Particle Script -->
<script>
    // Particle System Implementation
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;

    function init() {
        resize();
        for (let i = 0; i < 40; i++) {
            particles.push(createParticle());
        }
        animate();
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    function createParticle() {
        return {
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.4 + 0.1,
            color: Math.random() > 0.5 ? '#fd8b00' : '#b9c7e4'
        };
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.fill();
        });

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    
    // Check for reduced motion preference
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        init();
    }

    // Form submission feedback
    document.getElementById('notify-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
        btn.disabled = true;
        
        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
            btn.classList.replace('bg-secondary-container', 'bg-surface-tint');
            btn.classList.replace('text-on-secondary', 'text-on-primary');
            this.querySelector('input').value = '';
            this.querySelector('input').placeholder = "You're on the list!";
        }, 1500);
    });
</script>
